# Rust desktop app (desktop/) — build, lint and test on a Windows runner.
# The dev PC's Smart App Control blocks freshly built unsigned test binaries,
# so the Rust test loop runs here instead (Plan 6, 2026-11-07).
name: desktop

on:
  push:
    branches: ["main", "feat/**"]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same compiler as the dev PC; overrides `channel = "stable"` in desktop/rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: pwsh
    working-directory: desktop

jobs:
  test:
    name: fmt · clippy · test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: desktop-${{ runner.os }}-1.99.1-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-1.99.1-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo clippy (dev feature)
        run: cargo clippy --locked --all-targets --features dev -- -D warnings

      - name: cargo test (default features)
        run: cargo test --locked

      - name: cargo test (dev feature)
        run: cargo test --locked --features dev

  release:
    name: release build · audit
    runs-on: windows-latest
    timeout-minutes: 60
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --target x86_64-pc-windows-msvc

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-audit.exe
            desktop/target
          key: desktop-release-${{ runner.os }}-1.99.1-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-release-${{ runner.os }}-1.99.1-

      - name: cargo build --release (fixture payload)
        run: cargo build --release --locked

      - name: Smoke-run the release exe
        run: |
          $out = & .\target\release\mcp-monitor.exe --version
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "mcp-monitor --version exited $LASTEXITCODE" }

      - name: cargo audit
        run: |
          if (-not (Get-Command cargo-audit -ErrorAction SilentlyContinue)) {
            cargo install cargo-audit --version 0.22.2 --locked
          }
          # Fails on vulnerabilities; "unmaintained/unsound" warnings are Linux-only tauri crates (Task 1).
          cargo audit

      - name: Upload release exe (fixture payload)
        uses: actions/upload-artifact@v4
        with:
          name: mcp-monitor-fixture-${{ github.sha }}
          path: desktop/target/release/mcp-monitor.exe
          retention-days: 7
