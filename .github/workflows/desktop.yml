# Rust desktop app (desktop/) — build, lint and test on a Windows runner.
# The dev PC's Smart App Control blocks freshly built unsigned test binaries,
# so the Rust test loop runs here instead (Plan 6, 2026-11-07). The server's agent integration
# tests run here too, with both agents (the Rust one needs the exe built here, Task 11).
# The release job runs install\build-desktop.ps1 end to end with the real payload and uploads the
# release mcp-monitor.exe (Task 13). Since the review fix wave, server, web, agent and install changes
# trigger it too (path filter below); a change outside the filter needs a run by hand
# (workflow_dispatch) before a release.
# The test job also runs the tests that need a standard token as a throw-away local standard user
# (.github/scripts/standard-user-tests.ps1, review I1): on the elevated runner they would only skip.
#
# Path filter (Plan 6 review I2): every input the Rust tests, the [desktop] server tests and the release
# payload read. The Rust tests read docs/ops/OPERATIONS.md (every CLI option documented) and
# server/tests/fixtures/agent-events.json (event parity); the server's agent integration tests run the
# whole server app (agent_api.py proof header, bundle.py / __main__.py / collect/cli.py agent command,
# winsvc description parity) against both agents (agent/** is the Python one); the release job builds the
# payload from server/, web/ and install/. A change elsewhere (other docs, dummy-mcps, the PLAN) does not
# run this workflow; the lists are kept the same for push and pull_request.
name: desktop

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      - ".github/scripts/**"
      - "docs/ops/OPERATIONS.md"
      - "server/app/**"
      - "server/pyproject.toml"
      - "server/uv.lock"
      - "server/tests/conftest.py"
      - "server/tests/live.py"
      - "server/tests/fixtures/agent-events.json"
      - "server/tests/test_integration_agent.py"
      - "server/tests/desktop_bundle_main.py"
      - "server/tests/test_desktop_build.py"
      - "server/tests/test_desktop_exe.py"
      - "agent/**"
      - "install/**"
      - "web/**"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      - ".github/scripts/**"
      - "docs/ops/OPERATIONS.md"
      - "server/app/**"
      - "server/pyproject.toml"
      - "server/uv.lock"
      - "server/tests/conftest.py"
      - "server/tests/live.py"
      - "server/tests/fixtures/agent-events.json"
      - "server/tests/test_integration_agent.py"
      - "server/tests/desktop_bundle_main.py"
      - "server/tests/test_desktop_build.py"
      - "server/tests/test_desktop_exe.py"
      - "agent/**"
      - "install/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same compiler as the dev PC; overrides `channel = "stable"` in desktop/rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: pwsh
    working-directory: desktop

jobs:
  test:
    name: fmt · clippy · test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: desktop-${{ runner.os }}-1.99.1-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-1.99.1-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo clippy (dev feature)
        run: cargo clippy --locked --all-targets --features dev -- -D warnings

      - name: cargo test (default features)
        # The runner's user is an elevated administrator on a disposable VM: let the Y23-guarded
        # tests run (winutil::elevated_tests_allowed). Tests that need a standard token skip with
        # a printed "SKIPPED …" line.
        env:
          MCPMON_TESTS_ALLOW_ELEVATED: "1"
        run: cargo test --locked

      - name: cargo test (dev feature)
        env:
          MCPMON_TESTS_ALLOW_ELEVATED: "1"
        run: cargo test --locked --features dev

      - name: WebView2 notice window (real windows on the runner desktop)
        env:
          MCPMON_TESTS_ALLOW_ELEVATED: "1"
        run: cargo test --locked --test agent_webview -- --ignored --test-threads=1

      - name: WebView2 app window (real windows on the runner desktop, dev build)
        # One at a time: the app is a single instance per session (Plan 6 Task 12).
        env:
          MCPMON_TESTS_ALLOW_ELEVATED: "1"
        run: cargo test --locked --features dev --test app_window -- --ignored --test-threads=1

      - name: cargo build (the agent exe for the server integration tests)
        run: cargo build --locked

      - name: Standard-user tests (non-admin guarantees, review I1)
        # The runner user is an elevated administrator: every test that proves "without admin rights:
        # exit 1, nothing changed" printed SKIPPED above. Here they run again as a throw-away local
        # account in Users only (random password, masked; deleted at the end), from the default-feature
        # test binaries and target\debug\mcp-monitor.exe just built. The step fails when one of them is
        # missing, fails, is not reported ok, or anything prints SKIPPED, or when the account's token is
        # elevated. Windows PowerShell 5.1 (Start-Process -Credential, ADSI).
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & ..\.github\scripts\standard-user-tests.ps1

      - name: Install uv 0.13.7
        run: python -m pip install --disable-pip-version-check "uv==0.13.7"

      - name: Server environment (Python 3.15.2 from uv)
        working-directory: server
        run: uv sync --locked

      - name: Server agent integration (python + desktop agents)
        # The same scenarios with `python -m mcp_agent` and the Rust `mcp-monitor.exe agent` (Plan 6
        # Task 11); MCPMON_DESKTOP_EXE turns the [desktop] half on.
        working-directory: server
        env:
          MCPMON_DESKTOP_EXE: ${{ github.workspace }}\desktop\target\debug\mcp-monitor.exe
        run: uv run python -m pytest -m integration tests/test_integration_agent.py -v -rs

  release:
    # install\build-desktop.ps1 end to end (Plan 6 Task 13): the real payload (install\build.ps1:
    # pip-audit, pnpm audit, web build, PyInstaller server), cargo audit, the release build with
    # the payload embedded, its checks; then the `desktop` server tests against the result.
    name: release build · audit
    runs-on: windows-latest
    timeout-minutes: 90
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal --target x86_64-pc-windows-msvc

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-audit.exe
            desktop/target
          key: desktop-release-${{ runner.os }}-1.99.1-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-release-${{ runner.os }}-1.99.1-

      - name: Version of this build (desktop/Cargo.toml)
        # Review item 21: the release file names come from Cargo.toml, not a literal.
        working-directory: .
        run: |
          $m = Select-String -Path desktop/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $m) { throw "no version in desktop/Cargo.toml" }
          $v = $m.Matches[0].Groups[1].Value
          "MCPMON_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "version $v"

      - name: Install cargo-audit 0.22.2
        # Review item 20: a cached cargo-audit.exe (restore-keys may bring an older entry) is used
        # only when it is exactly 0.22.2.
        run: |
          $have = if (Get-Command cargo-audit -ErrorAction SilentlyContinue) { (cargo audit --version) } else { "" }
          if ("$have".Trim() -ne "cargo-audit 0.22.2") {
            cargo install cargo-audit --version 0.22.2 --locked --force
          }
          $have = (cargo audit --version)
          if ("$have".Trim() -ne "cargo-audit 0.22.2") { throw "cargo audit --version: $have" }

      - name: Install Node 26.13.0
        uses: actions/setup-node@v5.0.0
        with:
          node-version: "26.13.0"

      - name: Install pnpm 12.16.1 and the web dependencies
        working-directory: web
        run: |
          npm install --global "pnpm@12.16.1"
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Install uv 0.13.7
        run: python -m pip install --disable-pip-version-check "uv==0.13.7"

      - name: Server environment (Python 3.15.2 from uv)
        working-directory: server
        run: uv sync --locked

      - name: install\build-desktop.ps1 (real payload, audits, release build, checks)
        # Windows PowerShell 5.1, as on a release PC. No -SignThumbprint: nothing is signed (D5).
        working-directory: .
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File install\build-desktop.ps1
          if ($LASTEXITCODE -ne 0) { throw "build-desktop.ps1 exited $LASTEXITCODE" }
          Get-ChildItem dist\mcp-monitor-*.exe* | Format-Table Name, Length

      - name: Smoke-run the release exe
        # The exe is GUI-subsystem. pwsh waits for a GUI exe and reads its output only when the
        # exe sits inside a pipeline: `$x = & gui.exe` alone starts it in the background, closes
        # the stdout pipe and leaves $LASTEXITCODE unset. So: a pipe via `| Write-Output`, then a
        # file via Start-Process -RedirectStandardOutput.
        working-directory: .
        run: |
          $exe = ".\dist\mcp-monitor-$env:MCPMON_VERSION.exe"
          $pattern = '^mcp-monitor ' + [regex]::Escape($env:MCPMON_VERSION) + ' \(payload [0-9a-f]{12}, release\)$'
          $out = & $exe --version | Write-Output
          if ($LASTEXITCODE -ne 0) { throw "mcp-monitor --version (pipe) exited $LASTEXITCODE" }
          Write-Host "pipe: $out"
          if ("$out" -notmatch $pattern) { throw "unexpected --version output through a pipe: '$out'" }
          $file = Join-Path $env:RUNNER_TEMP 'mcp-monitor-version.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $file
          if ($p.ExitCode -ne 0) { throw "mcp-monitor --version (file) exited $($p.ExitCode)" }
          $text = (Get-Content -Raw -Encoding utf8 $file).TrimEnd()
          Write-Host "file: $text"
          if ($text -notmatch $pattern) { throw "unexpected --version output in a file: '$text'" }

      - name: Server tests for the build scripts
        working-directory: server
        run: uv run python -m pytest tests/test_desktop_build.py -v

      - name: Server tests against the release exe (marker desktop)
        # The runner is elevated: the "install without admin" test skips with its reason (-rs).
        working-directory: server
        env:
          MCPMON_DESKTOP_EXE: ${{ github.workspace }}\dist\mcp-monitor-${{ env.MCPMON_VERSION }}.exe
        run: uv run python -m pytest -m desktop -v -rs

      - name: Server agent integration with the release exe
        # The same bytes as dist\mcp-monitor-<version>.exe, under the name the desktop bundle runs
        # (tests.desktop_bundle_main needs mcp-monitor.exe).
        working-directory: server
        env:
          MCPMON_DESKTOP_EXE: ${{ github.workspace }}\desktop\target\release\mcp-monitor.exe
        run: |
          $a = (Get-FileHash $env:MCPMON_DESKTOP_EXE).Hash
          $b = (Get-FileHash "..\dist\mcp-monitor-$env:MCPMON_VERSION.exe").Hash
          if ($a -ne $b) { throw "target\release\mcp-monitor.exe is not the built release exe" }
          uv run python -m pytest -m integration tests/test_integration_agent.py -v -rs

      - name: Upload the release exe (real payload)
        uses: actions/upload-artifact@v4
        with:
          name: mcp-monitor-release-${{ github.sha }}
          path: |
            dist/mcp-monitor-${{ env.MCPMON_VERSION }}.exe
            dist/mcp-monitor-${{ env.MCPMON_VERSION }}.exe.sha256
          if-no-files-found: error
          retention-days: 7
