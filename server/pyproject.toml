[project]
name = "mcp-monitor"
version = "1.1.0"
description = "Windows MCP monitor backend"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi",
    # uvicorn[standard] equivalent minus pyyaml (no cp315 wheel on PyPI; building needs MSVC).
    "uvicorn",
    "httptools",
    "websockets",
    "watchfiles",
    "python-dotenv",
    "pydantic",
    "httpx",
    "psutil",
    "pywin32==312 ; sys_platform == 'win32'",
]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pip-audit",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "types-psutil>=7.2.2.20260906",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: real subprocess scenario (Windows, needs dummy-mcps/.venv)",
    "winlive: real Windows API on this PC, no admin rights",
    "perf: 1M-row log query performance (builds a cache under server/.cache/)",
    "bundle: runs the built distribution bundle",
]
addopts = "-m 'not integration and not winlive and not perf and not bundle'"
# Per-test cap (pytest-timeout): a hung real-process test fails instead of hanging the whole run.
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Pinned instead of ruff's default (which widens with every release): pycodestyle errors, pyflakes,
# isort, pyupgrade, bugbear. E701/E702 stay off (one-line statements are the test style); B008 is the
# FastAPI `Depends(...)` idiom; E501 is not enforced (the formatter is not used).
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E701", "E702", "B008"]

[tool.mypy]
python_version = "3.15"
packages = ["app"]
ignore_missing_imports = true
