[project]
name = "mcp-monitor"
version = "0.1.0"
description = "Windows MCP monitor backend"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi",
    # uvicorn[standard] equivalent minus pyyaml (no cp315 wheel on PyPI; building needs MSVC).
    "uvicorn",
    "httptools",
    "websockets",
    "watchfiles",
    "python-dotenv",
    "pydantic",
    "httpx",
    "psutil",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pip-audit",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
